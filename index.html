<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MimoEDU – Học Toán vui, tiến bộ mỗi ngày!</title>
    <meta name="description" content="MimoEDU – Nền tảng học Toán thông minh dành cho học sinh tiểu học." />
    <meta name="application-name" content="MimoEDU" />
    <meta name="apple-mobile-web-app-title" content="MimoEDU" />
    <meta property="og:site_name" content="MimoEDU" />
    <meta property="og:title" content="MimoEDU – Học Toán vui, tiến bộ mỗi ngày!" />
    <meta property="og:description" content="MimoEDU – Nền tảng học Toán thông minh dành cho học sinh tiểu học." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts and KaTeX styles load without blocking the first paint -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <link rel="preload" as="style" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" />
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous" />
    </noscript>
    <link rel="preload" as="image" href="/assets/mimo/mimo-240.jpg" />
    <style>
      /* Shown until React mounts, so the page is never blank while the app loads */
      #mimo-boot { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center;
        background: linear-gradient(#E3F1FF, #F4EEFF); font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; color: #1F2A55; }
      #mimo-boot img { width: 112px; height: 112px; border-radius: 9999px; border: 4px solid #fff; box-shadow: 0 12px 30px -10px rgba(84,200,255,.7); object-fit: cover; animation: mimo-boot-float 4s ease-in-out infinite; }
      #mimo-boot p { margin: 0; font-size: 18px; font-weight: 800; }
      #mimo-boot i { display: inline-block; width: 12px; height: 12px; margin: 0 4px; border-radius: 9999px; background: #2563EB; animation: mimo-boot-dot 1.1s ease-in-out infinite; }
      #mimo-boot i:nth-child(2) { animation-delay: .15s; }
      #mimo-boot i:nth-child(3) { animation-delay: .3s; }
      @keyframes mimo-boot-float { 50% { transform: translateY(-8px); } }
      @keyframes mimo-boot-dot { 0%, 80%, 100% { transform: translateY(0); opacity: .45; } 40% { transform: translateY(-7px); opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { #mimo-boot img, #mimo-boot i { animation: none; } }
    </style>
  </head>
  <body class="bg-[#FFFDF7] text-[#0F172A] antialiased selection:bg-blue-200 selection:text-slate-900">
    <div id="root">
      <div id="mimo-boot" role="status">
        <img src="/assets/mimo/mimo-240.jpg" alt="Linh vật Mimo" width="112" height="112" />
        <p>Mimo đang chuẩn bị bài học cho con...</p>
        <div aria-hidden="true"><i></i><i></i><i></i></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
